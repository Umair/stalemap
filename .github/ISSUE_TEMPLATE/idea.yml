name: Idea
description: A package, agent, language or feature stalemap should support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The stale code your agent wrote, or what you'd like stalemap to catch, and an example if you have one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
